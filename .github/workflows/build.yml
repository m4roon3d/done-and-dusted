name: Build

# Runs only when asked, to save build minutes:
#   - Actions tab → Build → "Run workflow", or
#   - push a version tag, e.g.  git tag v1.0.1 && git push origin v1.0.1
# The web app does not need this workflow: Render deploys it on every push to main.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional: build this version tag (e.g. v1.0.0) and attach its APK to that release"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets the Android job publish the APK as a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist }

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      # Version tag to attach the APK to: the pushed tag, or the one typed in "Run workflow"
      VERSION_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: done-and-dusted-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Name the APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk done-and-dusted.apk
      - name: Publish APK as the "latest" release
        if: inputs.release_tag == '' || inputs.release_tag == null
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk done-and-dusted.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest done-and-dusted.apk \
            --target "$GITHUB_SHA" \
            --title "Latest Android build" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Download done-and-dusted.apk on your phone and open it to install."
      - name: Attach APK to the version release
        if: env.VERSION_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$VERSION_TAG" >/dev/null 2>&1 || \
            gh release create "$VERSION_TAG" --verify-tag --title "$VERSION_TAG" --notes "Android build of $VERSION_TAG."
          gh release upload "$VERSION_TAG" done-and-dusted.apk --clobber
